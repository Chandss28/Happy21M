<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180" fill="none">
  <defs>
    <linearGradient id="pinkBowLeft" x1="20" y1="20" x2="100" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFD9E4"/>
      <stop offset="50%" stop-color="#F29CB0"/>
      <stop offset="100%" stop-color="#D46E85"/>
    </linearGradient>
    <linearGradient id="pinkBowRight" x1="180" y1="20" x2="100" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFD9E4"/>
      <stop offset="50%" stop-color="#F29CB0"/>
      <stop offset="100%" stop-color="#C96279"/>
    </linearGradient>
    <linearGradient id="pinkKnot" x1="85" y1="55" x2="115" y2="95" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFE5EC"/>
      <stop offset="100%" stop-color="#C96279"/>
    </linearGradient>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#8A3B4E" flood-opacity="0.22"/>
    </filter>
  </defs>
  <g filter="url(#softShadow)">
    <!-- Ribbon Tails -->
    <path d="M92 84 C75 115, 52 145, 34 168 L58 162 L66 174 C80 146, 92 118, 98 88 Z" fill="url(#pinkBowLeft)" stroke="#FFFFFF" stroke-width="2.5"/>
    <path d="M108 84 C125 115, 148 145, 166 168 L142 162 L134 174 C120 146, 108 118, 102 88 Z" fill="url(#pinkBowRight)" stroke="#FFFFFF" stroke-width="2.5"/>
    <!-- Left Loop -->
    <path d="M96 74 C65 24, 14 26, 16 68 C18 108, 68 106, 96 78 Z" fill="url(#pinkBowLeft)" stroke="#FFFFFF" stroke-width="3"/>
    <path d="M84 72 C62 46, 34 50, 34 68 C34 84, 62 86, 84 74 Z" fill="#B55268" opacity="0.28"/>
    <!-- Right Loop -->
    <path d="M104 74 C135 24, 186 26, 184 68 C182 108, 132 106, 104 78 Z" fill="url(#pinkBowRight)" stroke="#FFFFFF" stroke-width="3"/>
    <path d="M116 72 C138 46, 166 50, 166 68 C166 84, 138 86, 116 74 Z" fill="#B55268" opacity="0.28"/>
    <!-- Glossy Highlights -->
    <path d="M32 52 C45 38, 68 42, 82 58" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.65"/>
    <path d="M168 52 C155 38, 132 42, 118 58" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.65"/>
    <!-- Center Knot -->
    <rect x="85" y="56" width="30" height="34" rx="12" fill="url(#pinkKnot)" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="100" cy="73" r="5" fill="#FFF5F8" opacity="0.8"/>
  </g>
</svg>
